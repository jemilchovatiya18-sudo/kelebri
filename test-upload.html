    <!DOCTYPE html>
<html>
<head>
    <title>Test Image Upload - Kelebri</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { margin: 10px 0; }
        input[type="password"] { padding: 8px; width: 100%; margin: 5px 0; }
        img { max-width: 100%; height: auto; margin: 10px 0; border: 1px solid #ddd; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Kelebri Image Upload Test</h1>
    
    <div id="status"></div>

    <div>
        <h3>Step 1: Login as Admin</h3>
        <input type="password" id="password" placeholder="Enter admin password" value="Kelebri@Admin2024">
        <button onclick="login()">Login</button>
    </div>

    <div id="uploadSection" style="display:none;">
        <h3>Step 2: Upload Image</h3>
        <input type="file" id="imageFile" accept="image/*">
        <button onclick="uploadImage()">Upload Image</button>
    </div>

    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let token = null;

        function showStatus(message, type) {
            document.getElementById('status').innerHTML = 
                `<div class="status ${type}">${message}</div>`;
        }

        async function login() {
            showStatus('🔄 Logging in...', 'info');
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@kelebri.com',
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    token = data.data.token;
                    showStatus('✅ Login successful! Token: ' + token.substring(0, 20) + '...', 'success');
                    document.getElementById('uploadSection').style.display = 'block';
                } else {
                    showStatus('❌ Login failed: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('❌ Error: ' + error.message + '<br><br>Is the backend running on http://localhost:5000?', 'error');
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            
            if (!fileInput.files || !fileInput.files[0]) {
                showStatus('❌ Please select an image first', 'error');
                return;
            }

            if (!token) {
                showStatus('❌ Please login first', 'error');
                return;
            }

            showStatus('🔄 Uploading image...', 'info');

            try {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);

                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('✅ Image uploaded successfully!', 'success');
                    document.getElementById('result').innerHTML = `
                        <h3>Upload Result:</h3>
                        <img src="${data.data.url}" alt="Uploaded">
                        <pre>${JSON.stringify(data.data, null, 2)}</pre>
                    `;
                } else {
                    showStatus('❌ Upload failed: ' + data.message, 'error');
                    document.getElementById('result').innerHTML = `
                        <h3>Error Details:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
                document.getElementById('result').innerHTML = `
                    <h3>Error Details:</h3>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        // Auto-check backend status on load
        window.onload = async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                showStatus('✅ Backend is running: ' + data.message, 'success');
            } catch (error) {
                showStatus('❌ Backend is NOT running! Please start it with: cd backend && npm run dev', 'error');
            }
        };
    </script>
</body>
</html>
